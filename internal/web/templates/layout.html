{{define "layout"}}<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#B51351">
<title>{{.Title}} · Shiv</title>
<link rel="icon" href="/static/shiv-logo.png">
<script src="/static/boot.js"></script>
<style>
  :root {
    /* Paleta Shiv: todo gira alrededor de rgb(181, 19, 81). */
    --brand-25:  #FDF7FA;
    --brand-50:  #FBEEF3;
    --brand-100: #F6DCE6;
    --brand-200: #EDB9CD;
    --brand-300: #DD86A7;
    --brand-400: #C94C7C;
    --brand-500: #B51351;
    --brand-600: #9C1046;
    --brand-700: #7E0D39;
    --brand-900: #3D0620;

    --canvas: #F4E3EA;      /* fondo general, como el lavanda de Deel */
    --panel:  #FCFAFB;      /* panel principal */
    --card:   #FFFFFF;
    --well:   #F1ECEE;      /* bandeja gris de "accesos rápidos" */
    --ink:    #1E1A1C;
    --muted:  #6B6268;
    --line:   #ECE3E7;
    --ok:     #1D7A46;  --ok-bg:   #E8F4EC;
    --warn:   #9A5B00;  --warn-bg: #FCF1DE;
    --bad:    #B3261E;  --bad-bg:  #FBECEB;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(61, 6, 32, .05), 0 2px 8px rgba(61, 6, 32, .04);
    --focus:  0 0 0 3px rgba(181, 19, 81, .25);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font: 15px/1.55 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink); background: var(--canvas);
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--brand-500); text-decoration-thickness: 1px; text-underline-offset: 2px; }
  a:hover { color: var(--brand-700); }
  :focus-visible { outline: none; box-shadow: var(--focus); border-radius: 8px; }

  /* ---------- logo (el PNG se usa como máscara: se puede pintar de cualquier color) ---------- */
  .logo-mark {
    display: block; aspect-ratio: 1000 / 395; background: currentColor;
    -webkit-mask: url(/static/shiv-logo.png) center / contain no-repeat;
            mask: url(/static/shiv-logo.png) center / contain no-repeat;
  }

  /* ---------- estructura tipo Deel ---------- */
  .shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); grid-template-rows: 66px 1fr; min-height: 100vh; }
  .side { grid-row: 1 / span 2; padding: 20px 14px; display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; }
  .brand { color: var(--brand-500); width: 92px; margin: 2px 8px 6px; display: block; transition: color .15s; }
  .brand:hover { color: var(--brand-700); }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav a {
    display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 10px;
    color: var(--ink); text-decoration: none; font-weight: 500; transition: background .15s;
  }
  .nav a svg { width: 18px; height: 18px; flex: none; color: var(--brand-900); }
  .nav a:hover { background: rgba(255, 255, 255, .55); color: var(--ink); }
  .nav a.active { background: var(--card); box-shadow: var(--shadow); }
  .nav a.active svg { color: var(--brand-500); }
  .side-foot { margin-top: auto; background: rgba(255, 255, 255, .55); border-radius: 12px; padding: 12px 14px; font-size: .84rem; color: var(--muted); }
  .side-foot strong { color: var(--brand-700); display: block; margin-bottom: 2px; }

  .top { display: flex; align-items: center; gap: 14px; padding: 0 28px; }
  .crumb { color: var(--muted); font-size: .9rem; margin-right: auto; display: flex; gap: 8px; align-items: center; }
  .crumb b { color: var(--ink); font-weight: 600; }
  .top .btn { padding: 7px 14px; font-size: .9rem; }

  .panel { background: var(--panel); border-top-left-radius: 28px; padding: 36px 40px 72px; min-width: 0; }
  .panel > .inner { max-width: 1080px; }

  /* ---------- tipografía ---------- */
  h1 { font-size: 2rem; line-height: 1.2; letter-spacing: -.02em; margin: 0 0 6px; font-weight: 700; }
  h2 { font-size: 1.12rem; margin: 34px 0 10px; letter-spacing: -.01em; }
  h3 { font-size: 1rem; margin: 16px 0 6px; }
  .muted { color: var(--muted); }
  .lead { color: var(--muted); font-size: 1.02rem; margin: 0 0 22px; max-width: 64ch; }

  /* ---------- componentes ---------- */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; margin: 10px 0; box-shadow: var(--shadow); }
  .flash, .error { border-radius: 12px; padding: 11px 16px; display: flex; gap: 10px; align-items: flex-start; }
  .flash { background: var(--ok-bg); color: #17592F; border: 1px solid #C3E2CD; margin: 0 0 20px; }
  .error { background: var(--bad-bg); color: #7A1912; border: 1px solid #F0C4C0; }
  .pill { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 4px 12px; font-size: .84rem; margin: 0 8px 8px 0; border: 1px solid var(--line); background: var(--card); }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pill.ok { color: var(--ok); background: var(--ok-bg); border-color: transparent; }
  .pill.warn { color: var(--warn); background: var(--warn-bg); border-color: transparent; }

  label { display: block; font-size: .85rem; color: var(--muted); margin: 12px 0 4px; font-weight: 500; }
  input[type=text], input[type=email], textarea {
    width: 100%; font: inherit; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px;
    background: #fff; color: var(--ink); transition: border-color .15s, box-shadow .15s;
  }
  input[type=text]:hover, textarea:hover { border-color: var(--brand-200); }
  input[type=text]:focus, input[type=email]:focus, textarea:focus { outline: none; border-color: var(--brand-400); box-shadow: var(--focus); }
  input[type=file] { font: inherit; max-width: 100%; }
  input[type=file]::file-selector-button { font: inherit; margin-right: 12px; border: 1px solid var(--line); background: var(--brand-50); color: var(--brand-700); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  input[type=checkbox] { accent-color: var(--brand-500); width: 16px; height: 16px; }
  textarea { resize: vertical; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  .grid3 { display: grid; grid-template-columns: 2fr 2fr 1fr; gap: 0 16px; }

  button, .btn {
    font: inherit; font-weight: 600; background: var(--brand-500); color: #fff; border: 1px solid var(--brand-500);
    border-radius: 10px; padding: 9px 18px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
    transition: background .15s, border-color .15s, transform .08s;
  }
  button:hover, .btn:hover { background: var(--brand-600); border-color: var(--brand-600); color: #fff; }
  button:active, .btn:active { transform: translateY(1px); }
  button.secondary, .btn.secondary { background: var(--card); color: var(--ink); border-color: var(--line); }
  button.secondary:hover, .btn.secondary:hover { background: var(--brand-50); border-color: var(--brand-200); color: var(--brand-700); }

  table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
  th, td { text-align: left; padding: 11px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); background: var(--brand-25); font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  tbody tr:hover td, tr:hover td { background: var(--brand-25); }
  .badge { font-size: .78rem; font-weight: 600; border-radius: 6px; padding: 3px 9px; white-space: nowrap; }
  .badge.present { background: var(--ok-bg); color: var(--ok); }
  .badge.replaceable { background: var(--brand-50); color: var(--brand-600); }
  .badge.missing { background: var(--warn-bg); color: var(--warn); }
  del { background: var(--bad-bg); color: #7A1912; text-decoration: line-through; border-radius: 4px; padding: 0 3px; }
  ins { background: var(--ok-bg); color: #17592F; text-decoration: none; border-radius: 4px; padding: 0 3px; }
  .change { transition: border-color .15s; }
  .change:has(input:checked) { border-color: var(--brand-200); background: var(--brand-25); }
  .change label { display: flex; gap: 12px; align-items: flex-start; margin: 0; color: var(--ink); font-size: 1rem; font-weight: 400; cursor: pointer; }
  .change input { margin-top: 5px; }
  .ctx { font-size: .9rem; color: var(--muted); margin: 4px 0 0; }
  iframe.preview { width: 100%; height: 1120px; border: 1px solid var(--line); background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); }
  details { margin-top: 10px; color: var(--muted); font-size: .9rem; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 16px 0; }

  /* ---------- home ---------- */
  .home { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: start; }
  .well { background: var(--well); border-radius: 18px; padding: 16px; }
  .well-title { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: .92rem; margin: 2px 4px 14px; }
  .well-title svg { width: 16px; height: 16px; color: var(--brand-500); }
  .quick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .quick > a, .quick > form > button {
    all: unset; box-sizing: border-box; width: 100%; height: 100%; min-height: 112px; cursor: pointer;
    background: var(--card); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; gap: 18px;
    color: var(--ink); font-weight: 500; box-shadow: var(--shadow); transition: transform .15s, box-shadow .15s;
  }
  .quick > form { margin: 0; }
  .quick > a:hover, .quick > form > button:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(61, 6, 32, .09); color: var(--ink); background: var(--card); }
  .quick > a:focus-visible, .quick > form > button:focus-visible { box-shadow: var(--focus); }
  .ico { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--brand-100); color: var(--brand-700); }
  .ico svg { width: 16px; height: 16px; }
  .ico.alt { background: #FBE7C9; color: #7A4A00; }
  .ico.alt2 { background: #DCE8FB; color: #1C4A8F; }
  .side-col .card { margin: 0 0 16px; }
  .side-col h3 { margin: 0 0 12px; display: flex; align-items: center; gap: 10px; }
  .count { font-size: .78rem; background: var(--well); border-radius: 6px; padding: 1px 8px; color: var(--muted); font-weight: 600; }
  .status-row { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); font-size: .9rem; }
  .status-row:first-of-type { border-top: 0; padding-top: 0; }
  .status-row .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; flex: none; }
  .dot.ok { background: var(--ok); } .dot.warn { background: #D98A00; }
  .empty { text-align: center; padding: 34px 20px; color: var(--muted); }
  .empty .logo-mark { width: 64px; margin: 0 auto 12px; color: var(--brand-200); }

  /* ---------- animación de carga: un corte de izquierda a derecha ---------- */
  .loader {
    position: fixed; inset: 0; z-index: 1000; background: var(--brand-500);
    display: grid; place-items: center; overflow: hidden;
    animation: loader-out .5s cubic-bezier(.76, 0, .24, 1) 1.2s forwards;
  }
  .intro-seen .loader { display: none; }
  .loader-stage { position: relative; width: min(62vw, 420px); aspect-ratio: 1000 / 395; }
  .loader-stage .logo-mark { position: absolute; inset: 0; color: #fff; }
  .loader-logo { clip-path: polygon(-30% 0, -5% 0, -30% 100%, -30% 100%); animation: logo-cut .34s cubic-bezier(.86, 0, .14, 1) .2s forwards; }
  .loader-blade {
    position: absolute; top: -40%; height: 180%; width: 3px; left: -18%; background: #fff; opacity: 0;
    transform: skewX(-32deg); box-shadow: 0 0 14px 3px rgba(255, 255, 255, .75), 0 0 46px 10px rgba(255, 255, 255, .25);
    animation: blade .34s cubic-bezier(.86, 0, .14, 1) .2s forwards;
  }
  .loader-bar { position: absolute; left: 0; right: 0; bottom: -42px; height: 2px; background: rgba(255, 255, 255, .22); border-radius: 2px; overflow: hidden; }
  .loader-bar::after { content: ""; position: absolute; inset: 0; background: #fff; transform-origin: left; transform: scaleX(0); animation: bar 1.05s cubic-bezier(.6, 0, .2, 1) .1s forwards; }
  @keyframes logo-cut {
    to { clip-path: polygon(-30% 0, 130% 0, 105% 100%, -30% 100%); }
  }
  @keyframes blade {
    0%   { left: -18%; opacity: 1; }
    85%  { opacity: 1; }
    100% { left: 118%; opacity: 0; }
  }
  @keyframes bar { to { transform: scaleX(1); } }
  @keyframes loader-out {
    from { clip-path: polygon(-30% 0, 130% 0, 130% 100%, -30% 100%); }
    to   { clip-path: polygon(130% 0, 130% 0, 130% 100%, 100% 100%); visibility: hidden; }
  }
  @media (prefers-reduced-motion: reduce) {
    .loader { animation: fade-out .3s ease .5s forwards; }
    .loader-logo { animation: none; clip-path: none; }
    .loader-blade, .loader-bar { display: none; }
    @keyframes fade-out { to { opacity: 0; visibility: hidden; } }
  }

  /* ---------- responsive ---------- */
  @media (max-width: 1100px) { .home { grid-template-columns: 1fr; } }
  @media (max-width: 860px) {
    .shell { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; }
    .side { grid-row: auto; position: static; height: auto; flex-direction: row; align-items: center; padding: 14px 16px 8px; gap: 12px; overflow-x: auto; }
    .brand { width: 70px; margin: 0 6px 0 0; flex: none; }
    .nav { flex-direction: row; }
    .nav a { white-space: nowrap; padding: 7px 10px; }
    .side-foot { display: none; }
    .top { padding: 0 16px 12px; }
    .panel { border-radius: 22px 22px 0 0; padding: 26px 16px 56px; }
    h1 { font-size: 1.6rem; }
  }
  @media (max-width: 640px) {
    .grid2, .grid3, .quick { grid-template-columns: 1fr; }
    .quick > a, .quick > form > button { min-height: 0; flex-direction: row; align-items: center; justify-content: flex-start; }
    .nav a span { display: none; }
    .nav a.active span { display: inline; }
    table { display: block; overflow-x: auto; }
  }
</style>
</head>
<body>
<div id="shiv-loader" class="loader" aria-hidden="true">
  <div class="loader-stage">
    <span class="logo-mark loader-logo"></span>
    <span class="loader-blade"></span>
    <span class="loader-bar"></span>
  </div>
</div>

<div class="shell">
  <aside class="side">
    <a class="brand" href="/" aria-label="Shiv, ir al inicio"><span class="logo-mark"></span></a>
    <nav class="nav" aria-label="Principal">
      <a href="/"{{if or (eq .Title "Inicio") (eq .Title "Versión")}} class="active" aria-current="page"{{end}}>
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3.2 2.8 11h2.7v9.3h5V14h3v6.3h5V11h2.7z"/></svg><span>Inicio</span></a>
      <a href="/cv"{{if eq .Title "CV maestro"}} class="active" aria-current="page"{{end}}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg><span>CV maestro</span></a>
      <a href="/jobs/new"{{if or (eq .Title "Nueva oferta") (eq .Title "Keywords") (eq .Title "Cambios")}} class="active" aria-current="page"{{end}}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/></svg><span>Nueva oferta</span></a>
    </nav>
    <div class="side-foot"><strong>Sin inventar nada</strong>La IA propone, Go valida y vos decidís.</div>
  </aside>

  <div class="top">
    <div class="crumb"><span>Shiv</span><span aria-hidden="true">/</span><b>{{.Title}}</b></div>
    {{if ne .Title "Nueva oferta"}}<a class="btn" href="/jobs/new"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Nueva oferta</a>{{end}}
  </div>

  <main class="panel"><div class="inner">
  {{if .Flash}}<p class="flash" role="status">{{.Flash}}</p>{{end}}
  {{template "content" .}}
  </div></main>
</div>
</body>
</html>{{end}}
